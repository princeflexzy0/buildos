<div id="walletModal" class="wallet-modal">
  <div class="wallet-modal-box">
    <h3>Connect a wallet</h3>
    <p class="modal-sub">Choose which wallet to use on X Layer testnet.</p>
    <div class="wallet-option" onclick="connectWith('okx')"><img src="assets/wallets/okx.svg" alt="OKX Wallet" onerror="this.style.display='none'"> OKX Wallet</div>
    <div class="wallet-option" onclick="connectWith('metamask')"><img src="assets/wallets/metamask.svg" alt="MetaMask" onerror="this.style.display='none'"> MetaMask</div>
    <div class="wallet-modal-close" onclick="closeWalletModal()">Cancel</div>
  </div>
</div>
