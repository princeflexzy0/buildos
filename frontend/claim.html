<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claim Funds — BuildOS</title>
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1786218938">
<style>
  .claim-wrap { max-width: 480px; margin: 80px auto; padding: 0 24px; }
  .claim-card { background: #fff; border: 1px solid #e5e5e0; border-radius: 16px; padding: 36px; }
  .claim-status { padding: 12px 16px; border-radius: 8px; margin: 16px 0; font-size: 0.95em; }
  .claim-status.error { background: #fdecea; color: #b3261e; border: 1px solid #f5c6c6; }
  .claim-status.success { background: #e8f5e9; color: #2d6a4f; border: 1px solid #a5d6a7; }
  .claim-status.info { background: #fff8e1; color: #a67c00; border: 1px solid #f0e080; }
  .claim-amount { font-size: 2.2em; font-weight: 700; margin: 20px 0 4px; color: #1a1a17; }
  .claim-label { color: #888; font-size: 0.9em; margin-bottom: 28px; }
  .letter-box { background: #faf9f5; border-left: 3px solid #2d6a4f; border-radius: 6px; padding: 16px 20px; color: #333; line-height: 1.7; font-style: italic; margin: 20px 0; font-size: 0.95em; }
  .code-input { width: 100%; padding: 16px; font-family: 'JetBrains Mono', monospace; font-size: 1.6em; font-weight: 600; text-align: center; letter-spacing: 0.2em; border: 2px solid #e5e5e0; border-radius: 10px; outline: none; box-sizing: border-box; text-transform: uppercase; margin: 8px 0 4px; }
  .code-input:focus { border-color: #1a1a17; }
  .code-label { color: #888; font-size: 0.82em; margin-bottom: 20px; display: block; }
  .btn-claim { width: 100%; padding: 15px; background: #1a1a17; color: #fff; border: none; border-radius: 10px; font-size: 1em; font-weight: 600; cursor: pointer; margin-top: 8px; transition: opacity 0.2s; }
  .btn-claim:disabled { opacity: 0.4; cursor: not-allowed; }
  .tx-link { display: block; margin-top: 14px; font-size: 0.85em; color: #2d6a4f; word-break: break-all; text-align: center; }
  .loading { color: #888; text-align: center; padding: 20px 0; }
</style>
</head>
<body>
<header class="nav">
  <div class="nav-inner">
    <a href="index.html" class="brand">
      <div class="logo-hex"><img src="assets/logo-white.png" alt="BuildOS" style="width:100%;height:100%;object-fit:contain"></div>
      <div class="brand-text"><span class="brand-name">BuildOS</span><span class="brand-sub">ONCHAIN AGENTS</span></div>
    </a>
  </div>
</header>

<main>
  <div class="claim-wrap">
    <div class="claim-card" id="mainCard">
      <p class="loading">Loading your claim…</p>
    </div>
  </div>
</main>

<script src="config.js"></script>
<script>
const MONITOR = window.BUILDOS_CONFIG?.MONITOR_URL || "https://signal-monitor-production-a2b9.up.railway.app";
const params = new URLSearchParams(location.search);
const depositId = params.get("depositId") || window.location.hash.replace("#","") || null;

function card(html) {
  document.getElementById("mainCard").innerHTML = html;
}

function showError(msg) {
  card(`<h2 style="margin:0 0 8px">Claim Funds</h2>
    <div class="claim-status error">${msg}</div>
    <a href="/" style="font-size:0.9em;color:#888">← Back to BuildOS</a>`);
}

async function loadClaim() {
  if (!depositId && depositId !== "0") {
    showError("No claim link found. Use the link from your email.");
    return;
  }

  try {
    const res = await fetch(`${MONITOR}/claim-info/${depositId}`);
    const data = await res.json();

    if (!res.ok || data.error) {
      showError(data.error || "Claim not found.");
      return;
    }

    if (data.claimed) {
      card(`
        <h2 style="margin:0 0 8px">Already Claimed</h2>
        <div class="claim-status success">✅ These funds have already been released.</div>
        <a href="/" style="font-size:0.9em;color:#888">← Back to BuildOS</a>
      `);
      return;
    }

    const amountDisplay = data.amount
      ? (Number(data.amount) / 1e18).toFixed(6) + " OKB"
      : "funds";

    const letterHtml = data.letter
      ? `<div class="letter-box">${data.letter.replace(/\n/g, "<br>")}</div>`
      : "";

    const needsCode = data.hasCode;

    card(`
      <h2 style="margin:0 0 4px">Someone sent you funds</h2>
      <p style="color:#888;margin:0 0 20px;font-size:0.9em">via <strong>${data.label || "BuildOS Agent"}</strong></p>

      ${letterHtml}

      <div class="claim-amount">${amountDisplay}</div>
      <div class="claim-label">will be sent to your address automatically</div>

      ${needsCode ? `
        <label style="display:block;font-size:0.9em;font-weight:500;color:#1a1a17;margin-bottom:4px">Enter your claim code</label>
        <input class="code-input" id="codeInput" maxlength="8" placeholder="XXXXXX" autocomplete="off" oninput="this.value=this.value.toUpperCase()">
        <span class="code-label">Check your email for the 6-character code</span>
      ` : ""}

      <div id="claimStatus"></div>
      <button class="btn-claim" id="claimBtn" onclick="doClaim()">💰 Claim My Funds</button>
      <a id="txLink" class="tx-link" style="display:none" target="_blank"></a>
    `);
  } catch(e) {
    showError("Could not load claim: " + e.message);
  }
}

async function doClaim() {
  const btn = document.getElementById("claimBtn");
  const statusEl = document.getElementById("claimStatus");
  const code = document.getElementById("codeInput")?.value?.trim() || "";

  btn.disabled = true;
  btn.textContent = "Releasing funds…";
  statusEl.className = "";
  statusEl.textContent = "";

  try {
    const res = await fetch(`${MONITOR}/claim/${depositId}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code }),
    });
    const data = await res.json();

    if (data.already) {
      statusEl.className = "claim-status success";
      statusEl.textContent = "✅ Already claimed — funds were sent to the recipient.";
      btn.textContent = "Already Claimed";
      return;
    }
    if (!data.success) throw new Error(data.error || "Claim failed");

    const explorer = window.BUILDOS_CONFIG?.EXPLORER_TX_BASE || "https://www.okx.com/web3/explorer/xlayer-test/tx";
    statusEl.className = "claim-status success";
    statusEl.innerHTML = `✅ Funds released! Sent to <code>${data.recipient?.slice(0,6)}…${data.recipient?.slice(-4)}</code>`;
    btn.textContent = "Claimed ✓";

    const txLink = document.getElementById("txLink");
    if (data.txHash) {
      txLink.href = `${explorer}/${data.txHash}`;
      txLink.textContent = "View transaction on explorer ↗";
      txLink.style.display = "block";
    }
  } catch(e) {
    statusEl.className = "claim-status error";
    statusEl.textContent = e.message;
    btn.disabled = false;
    btn.textContent = "Try Again";
  }
}

loadClaim();
</script>
</body>
</html>
